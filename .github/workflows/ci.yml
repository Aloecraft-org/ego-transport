name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  # Must match the pinned wasm-bindgen version in Cargo.toml/Cargo.lock. The
  # bindgen ABI is unstable and wasm-bindgen-test-runner refuses to run on a
  # mismatch (same constraint as .devcontainer/Dockerfile).
  WASM_BINDGEN_VERSION: 0.2.114

jobs:
  lint:
    name: Format + Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip2, wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: make fmt_check
      - name: Clippy (native, WASI, browser)
        run: make clippy

  native:
    name: Native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Same commands as `make build_native` / `make test_native`
      # (invoked directly because GNU make isn't on the Windows runners).
      - name: Build
        run: cargo build
      - name: Test
        run: cargo test
      # Self-contained integration binaries (real TCP/WS servers on loopback).
      - name: Standalone integration tests
        if: runner.os == 'Linux'
        run: make test_standalone

  wasi:
    name: WASI (wasm32-wasip2)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - name: Install wasmtime
        uses: bytecodealliance/actions/wasmtime/setup@v1
      - name: Build
        run: make build_wasi
      - name: Test (under wasmtime)
        run: make test_wasi

  browser:
    name: Browser (wasm32-unknown-unknown)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-bindgen-cli (prebuilt, pinned)
        run: |
          curl -sSfL "https://github.com/rustwasm/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl.tar.gz" | tar xz
          sudo install -m 755 "wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl"/wasm-bindgen* /usr/local/bin/
          wasm-bindgen-test-runner --version
      - name: Build
        run: make build_browser
      # Runs via wasm-bindgen-test-runner (see .cargo/config.toml) against the
      # headless browser + webdriver preinstalled on the runner image.
      - name: Test (headless browser)
        run: make test_browser
