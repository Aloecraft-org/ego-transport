[package]
name = "ego_transport"
version = "0.1.4"
edition = "2024"
rust-version = "1.88"
description = "Cross-platform transport layer (TCP, WebSocket, WebRTC) for native, WASI P2, and browser targets"
repository = "https://github.com/Aloecraft-org/ego-transport"

[lib]
name = "ego_transport"
path = "src/lib.rs"

# Test/demo binaries in src/bin/ are picked up by cargo's auto-discovery.

[dependencies]
ego_platform = { git = "https://github.com/Aloecraft-org/ego-platform" }
async-trait = "0.1"
log = "0.4"
futures = "0.3"
thiserror = "2"
tokio = { version = "1", default-features = false }

# === WASM common (WASI and browser) ===
[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1", features = ["sync", "macros", "io-util", "rt", "time"] }

# === Native only ===
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
tungstenite = { version = "0.24", default-features = false }
env_logger = "0.11"
webrtc = "0.17"
bytes = "1"
# SSH, on russh's `ring` backend rather than its default `aws-lc-rs`. ring is
# already in the tree (webrtc's DTLS, stun/turn, the TURN credential HMAC
# below); aws-lc-rs would add a second crypto stack through aws-lc-sys, a
# native AWS-LC build that costs every consumer a per-target C toolchain
# (cmake, plus NASM on x86_64-pc-windows-gnu). The suite ssh_native.rs speaks
# (curve25519 kex, ed25519 keys, chacha20-poly1305) is all on the ring path.
# The feature list is russh's defaults minus that backend. Features are
# additive, so CI guards against aws-lc-sys coming back through another
# crate's feature.
russh = { version = "0.63", default-features = false, features = ["ring", "flate2", "rsa"] }
rand = { version = "0.10", features = ["thread_rng"] }
# TURN relay. The protocol has HMAC auth, allocation lifecycles, permissions
# and channel framing — stateful machinery where a bug means an open relay —
# so it comes from the maintained implementation, not from scratch.
turn = { version = "0.17", features = ["metrics"] }
webrtc-util = "0.17"
# For coturn-style ephemeral TURN credentials. The HMAC itself comes from a
# maintained implementation; only the documented composition is ours.
ring = "0.17"
base64 = "0.22"

# === WASI P2 only ===
[target.'cfg(all(target_arch = "wasm32", target_env = "p2"))'.dependencies]
wasip2 = "1.0"
tungstenite = { version = "0.24", features = ["handshake"] }

# === Browser only ===
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
# Pinned: the bindgen ABI is unstable and must match the wasm-bindgen-cli /
# wasm-bindgen-test-runner version installed in the devcontainer and CI
# (ego_platform pins the same version).
wasm-bindgen = "=0.2.127"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "WebSocket",
    "MessageEvent",
    "ErrorEvent",
    "CloseEvent",
    "BinaryType",
    "RtcPeerConnection",
    "RtcConfiguration",
    "RtcDataChannel",
    "RtcDataChannelInit",
    "RtcDataChannelEvent",
    "RtcDataChannelType",
    "RtcSessionDescriptionInit",
    "RtcSdpType",
    "RtcIceCandidate",
    "RtcIceCandidateInit",
    "RtcPeerConnectionIceEvent",
] }

[dev-dependencies]
ego_proc = { git = "https://github.com/Aloecraft-org/ego-proc" }
anyhow = "1"
uuid = "1"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test = "0.3"

# A real TURN client, so the relay server is tested against an independent
# implementation of the protocol rather than against itself.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
turn = "0.17"
webrtc-util = "0.17"
